apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: notification-service
data:
  SPRING_PROFILES_ACTIVE: docker
  SERVER_PORT: "8080"
  DB_HOST: "replace-with-rds-host"
  DB_PORT: "5432"
  DB_NAME: "notification_db"
  REDIS_HOST: "replace-with-elasticache-host"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "replace-with-msk-bootstrap:9092"
  JWT_ISSUER: "notification-service"
  JWT_EXPIRATION_MINUTES: "120"
