services:
# This is the root tag that tells Docker Compose you are about to define the individual containers (services) that make up your application architecture.
  app:
  # The internal name for your main application block.
    build:
    # Tells Docker that this image needs to be compiled from source code, rather than downloaded from the internet.
      context: .
      # ells Docker to look in the current directory (.) for the source code to build.
      dockerfile: Dockerfile
      # Specifies the exact name of the file containing your build instructions.
    image: notification-service:local
    # Once the build is finished, tag the resulting image with this name so it is easy to find.
    container_name: notification-service
    # Gives the running container this exact name instead of a randomly generated one.
    restart: unless-stopped
    # Tells Docker to automatically reboot this container if it crashes or if the host machine restarts, unless you manually stop it.
    depends_on:
    # Dictates startup order. This container will not start until the following services are ready.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # It forces the app to wait until Postgres, Redis, and Kafka explicitly pass their internal health checks before booting, preventing crash-loops.
    ports:
      - "8080:8080"
    # Maps networking ports between your physical computer and the container.
    env_file:
      - path: .env
        required: false
    # Loads local development secrets from .env when the file exists. The file is ignored by Git.
    environment:
    # Keeps Docker-only wiring here. Secrets and provider credentials come from .env.
      SPRING_PROFILES_ACTIVE: "docker"
      # Tells your Spring Boot app to use the docker profile
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-notification_db}"
      DB_USERNAME: "${DB_USERNAME:-admin}"
      DB_PASSWORD: "${DB_PASSWORD:-admin}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      JWT_SECRET: "${JWT_SECRET:-replace-this-dev-secret-with-a-long-random-value}"
      JWT_ISSUER: "${JWT_ISSUER:-notification-service-local}"
      JWT_EXPIRATION_MINUTES: "${JWT_EXPIRATION_MINUTES:-120}"
    
  postgres:
  # The internal name for the database service.
    image: postgres:15-alpine
    # Downloads the official PostgreSQL version 15 image, built on Alpine Linux (a highly minimized operating system).
    restart: unless-stopped
    container_name: notification-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${DB_NAME:-notification_db}"
      POSTGRES_USER: "${DB_USERNAME:-admin}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-admin}"
    volumes:
      # Defines storage that survives container deletion.
      - postgres_data:/var/lib/postgresql/data
      # Maps the Docker volume named postgres_data to the specific folder inside the container where Postgres saves its files.

    healthcheck:
    # The test Docker runs to see if the container is actually ready for traffic.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      # Runs the native pg_isready command inside the container to check if the database is accepting connections.
      interval: 10s
      timeout: 5s
      retries: 5
      # Runs the test every 10s. If the command takes longer than 5s, it counts as a failure. If it fails 5 times, the container is marked as "unhealthy".

  redis:
  # The internal name for the cache service.
    image: redis:7-alpine
    # Downloads official Redis version 7 on Alpine Linux.
    restart: unless-stopped
    container_name: notification-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Uses the Redis command line to send a "ping". If Redis is fully booted, it responds with "pong", passing the test.

  zookeeper:
  # The internal name for the cluster coordinator.
    image: confluentinc/cp-zookeeper:7.5.0
    # Downloads Confluent's official Zookeeper image.
    restart: unless-stopped
    container_name: notification-zookeeper
    environment:
    # Configuration for Zookeeper.
      ZOOKEEPER_CLIENT_PORT: "2181"
      # Sets the port Zookeeper listens on.
      ZOOKEEPER_TICK_TIME: "2000"
      # Sets the base time unit (in milliseconds) for heartbeats and timeouts.

  kafka:
  # The internal name for the message broker.
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    container_name: notification-kafka
    depends_on:
    # Ensures Zookeeper is booted before Kafka attempts to start.
      - zookeeper
    
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: notification-redisinsight
    ports:
      - "5540:5540"
    restart: unless-stopped

volumes:
# The root tag to formally declare persistent storage volumes used by this compose file.
  postgres_data:
  # Explicitly creates the storage volume referenced earlier by the Postgres container, ensuring Docker maintains the actual database files on your hard drive.
